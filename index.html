---
layout: default
title: Blog
---

<div class="contents">
  <h3>Contents</h3>
  <ul>
    {% for post in site.posts %}
    <li>
      <a href="#{{ post.title | slugify }}">{{ post.title }}</a>
      <span class="post-date">{{ post.date | date_to_string }}</span>
    </li>
    {% endfor %}
  </ul>
</div>

<hr>

<div class="posts">
  {% for post in site.posts %}
  <div class="post" id="{{ post.title | slugify }}">
    <h1 class="post-title">
      <a href="{{ post.url | absolute_url }}">
        {{ post.title }}
      </a>
    </h1>

    <span class="post-date">{{ post.date | date_to_string }}</span>

    {{ post.content }}
  </div>
  {% endfor %}
</div>
